# This is a Declarative Automation Bundle definition for dab_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_demo
  uuid: 765cea5b-3e3a-42b8-be8e-c5bfd107cd43

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-21217937-5c4a.cloud.databricks.com
    variables:
      catalog: dab_demo
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-21217937-5c4a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vikram.3par@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vikram.3par@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_demo
      schema: prod
    permissions:
      - user_name: vikram.3par@gmail.com
        level: CAN_MANAGE
